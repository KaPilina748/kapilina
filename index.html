<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>サイト移転のお知らせ</title>

  <!-- 検索エンジンに残したくない場合 -->
  <meta name="robots" content="noindex,nofollow" />

  <!-- 自動転送（0〜5秒の間で好みで調整。すぐ飛ばしたいなら 0） -->
  <meta http-equiv="refresh" content="0; url=https://kapilinakids.jp" />

  <!-- canonical -->
  <link rel="canonical" href="https://kapilinakids.jp" />

  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.7;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .card {
      border: 1px solid rgba(128,128,128,.25);
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      background: rgba(255,255,255,.02);
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 10px 0; }
    a.btn {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(128,128,128,.35);
      text-decoration: none;
      font-weight: 600;
    }
    .small { opacity: .8; font-size: 13px; margin-top: 16px; }
  </style>

  <script>
    // JSでも転送（meta refreshが効かない環境向け）
    setTimeout(function () {
      location.href = "https://kapilinakids.jp";
    }, 3000);
  </script>
</head>

<body>
  <main class="wrap">
    <section class="card" role="status" aria-live="polite">
      <h1>サイト移転のお知らせ</h1>
      <p> 新しいサイトに転送します。
      </p>

      <p>
        <a class="btn" href="https://kapilinakids.jp">https://kapilinakids.jp へ移動</a>
      </p>

      <p class="small">
        数秒後に自動的に新しいサイトへ移動します。移動しない場合は上のボタンをクリックしてください。
      </p>
    </section>
  </main>
</body>
</html>
